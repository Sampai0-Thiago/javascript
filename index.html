<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Document</title>
</head>

<body>
  <section class="square">

    <div class="math">
      <h2>A soma de A+B deve ser menor que C </h2>
      <label class="label" for="A">A</label>
      <input id="A" type="text" placeholder="Digite um número" required>
      <label class="label" for="B">B</label>
      <input id="B" type="text" placeholder="Digite um número" required>
      <label class="label" for="C">C</label>
      <input id="C" type="text" placeholder="Digite um número" required>
    </div>

    <div class="resultado">
      <button type="button" onclick="somar()">SOMAR</button>

      <textarea id="result" type="text" readonly></textarea>
    </div>
  </section>

  <div class="separar"></div>

  <section class="casamento">
    <h2 id="casada">Casada?</h2>

    <div class="dados">
      <label for="nome">Nome:</label>
      <input id="nome" name="nome" type="text">

      <label for="estadoCivil">Estado Civil:</label>
      <input id="estadoCivil" name="estadocivil" type="text">

      <label for="sexo">Sexo:</label>

      <div class="masculino">
        <label for="masculino">Masculino</label>
        <input id="masculino" name="sexo" type="radio" value="Masculino">
      </div>
      <div class="feminino">
        <label for="feminino">Feminino</label>
        <input id="feminino" name="sexo" type="radio" value="Feminino">
      </div>
      <div id="anosCasada">
        <label for="tempoCasada">Quantos anos de casamento?</label>
        <input id="tempoCasada" name="tempoCasada" type="number" min="0">
        <textarea id="resumoCasamento" readonly></textarea>
      </div>
    </div>
  </section>

  <script src="/script.js"></script>
</body>

</html>
